name: Release CLI
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate version tag
        shell: bash
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:cli
      - name: Verify release package
        run: |
          node dist/cli/inbox.mjs --help
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/cf-agent-inbox-cli.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/cf-agent-inbox-cli.tar.gz --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
